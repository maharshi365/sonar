name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            artifact: sonar-windows-x64
          - name: macOS Apple silicon
            runner: macos-26
            artifact: sonar-macos-arm64
          - name: macOS Intel
            runner: macos-26-intel
            artifact: sonar-macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "1.4.313.2"
          $installer = Join-Path $env:RUNNER_TEMP "VulkanSDK-Installer.exe"
          curl.exe -fL -o $installer "https://sdk.lunarg.com/sdk/download/$version/windows/vulkan_sdk.exe"
          & $installer --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$version"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$version\bin"

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: src/crates -> target
          cache-bin: false

      - name: Build native application
        run: cargo build --manifest-path src/crates/Cargo.toml -p sonar-app --release

      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release/Sonar | Out-Null
          Copy-Item src/crates/target/release/sonar.exe release/Sonar/Sonar.exe
          Copy-Item src/crates/target/release/*.dll release/Sonar/
          Compress-Archive -Path release/Sonar -DestinationPath release/Sonar-${{ github.ref_name }}-windows-x64.zip

      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release/Sonar.app/Contents/MacOS release/Sonar.app/Contents/Resources
          cp src/crates/target/release/sonar release/Sonar.app/Contents/MacOS/Sonar
          cp build/icon.svg release/Sonar.app/Contents/Resources/icon.svg
          cat > release/Sonar.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>Sonar</string>
            <key>CFBundleIdentifier</key><string>com.sonar.desktop</string>
            <key>CFBundleName</key><string>Sonar</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSMicrophoneUsageDescription</key><string>Sonar uses microphone audio for local speech-to-text transcription.</string>
          </dict></plist>
          PLIST
          ditto -c -k --sequesterRsrc --keepParent release/Sonar.app "release/Sonar-${{ github.ref_name }}-${{ matrix.artifact }}.zip"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d5aacfe7e00c6148901fe0f71c6013fc6a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: release/*.zip
          if-no-files-found: error
          compression-level: 0

  deploy:
    name: Deploy GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/*/*.zip --verify-tag --generate-notes
