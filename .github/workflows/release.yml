name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            arch: x64
            output: release/*
            artifact: sonar-windows-x64
          - name: macOS Apple silicon
            runner: macos-26
            arch: arm64
            output: release/*
            artifact: sonar-macos-arm64
          - name: macOS Intel
            runner: macos-26-intel
            arch: x64
            output: release/*
            artifact: sonar-macos-x64

    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "1.4.313.2"
          $installer = Join-Path $env:RUNNER_TEMP "VulkanSDK-Installer.exe"
          curl.exe -fL -o $installer "https://sdk.lunarg.com/sdk/download/$version/windows/vulkan_sdk.exe"
          & $installer --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$version"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$version\bin"

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: src/crates -> target
          key: ${{ matrix.arch }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST VULKAN_SDK
          cache-bin: false

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run package -- --${{ matrix.arch }}

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  deploy:
    name: Deploy GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir publish
          find release -type f -name 'Sonar-*' -exec cp {} publish/ \;
          cp release/sonar-windows-x64/latest.yml publish/
          ruby -ryaml -e '
            paths = Dir["release/sonar-macos-*/latest-mac.yml"]
            manifests = paths.map { |path| YAML.unsafe_load_file(path) }
            merged = manifests.first
            merged["files"] = manifests.flat_map { |manifest| manifest["files"] }
            File.write("publish/latest-mac.yml", YAML.dump(merged))
          '

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" publish/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" publish/* --verify-tag --generate-notes
          fi
