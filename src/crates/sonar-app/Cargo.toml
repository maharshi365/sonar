[package]
name = "sonar-app"
version.workspace = true
edition.workspace = true
description = "Native GPUI desktop application for Sonar."
license.workspace = true
build = "build.rs"

[[bin]]
name = "sonar"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = "3.6"
chrono = "0.4"
directories = "6"
global-hotkey = "0.7"
gpui = { git = "https://github.com/zed-industries/zed", rev = "91bf967e279fba3b326c096aeb66053cb2373547" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "91bf967e279fba3b326c096aeb66053cb2373547" }
parking_lot = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonar-audio = { path = "../sonar-audio" }
sonar-dictation = { path = "../sonar-dictation" }
sonar-input = { path = "../sonar-input" }
sonar-models = { path = "../sonar-models" }
sonar-transcription = { path = "../sonar-transcription" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
unicode-segmentation = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "91bf967e279fba3b326c096aeb66053cb2373547", features = ["wayland", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "91bf967e279fba3b326c096aeb66053cb2373547", features = ["font-kit"] }
