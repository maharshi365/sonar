[package]
name = "sonar-core"
version = "0.1.0"
edition = "2021"
description = "Rust core for Sonar: model catalog, download manager, and speech-to-text."
license = "MIT"

[lib]
# napi-rs builds a C dynamic library that Node loads as a native addon (.node).
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi6", "async", "tokio_rt", "serde-json"] }
napi-derive = "2"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
log = "0.4"

# Audio capture + processing (ported from Handy's audio_toolkit).
cpal = "0.16.0"
rubato = "0.16.2"
hound = "3.5.1"
rustfft = "6.4.0"

# Whisper-family speech-to-text via the whisper.cpp/ggml native backend.
# Streaming is supported here. GPU backends are selected per-platform below.
transcribe-cpp = { version = "0.1.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "0.1.3", default-features = false, features = ["metal"] }

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
transcribe-cpp = { version = "0.1.3", default-features = false, features = ["dynamic-backends", "vulkan"] }

[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "0.1.3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
transcribe-cpp = { version = "0.1.3", default-features = false, features = ["dynamic-backends", "vulkan"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
