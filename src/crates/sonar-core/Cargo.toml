[package]
name = "sonar-core"
version = "0.1.0"
edition = "2021"
description = "Rust core for Sonar: model catalog, download manager, and speech-to-text."
license = "MIT"

[lib]
# napi-rs builds a C dynamic library that Node loads as a native addon (.node).
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi6", "async", "tokio_rt", "serde-json"] }
napi-derive = "2"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
