[package]
name = "sonar-core"
version.workspace = true
edition.workspace = true
description = "N-API adapter for Sonar's local speech-to-text modules."
license.workspace = true

[lib]
# napi-rs builds a C dynamic library that Node loads as a native addon (.node).
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi6", "async", "tokio_rt", "serde-json"] }
napi-derive = "2"
sonar-dictation = { path = "../sonar-dictation" }
sonar-models = { path = "../sonar-models" }
sonar-transcription = { path = "../sonar-transcription" }

[build-dependencies]
napi-build = "2"
